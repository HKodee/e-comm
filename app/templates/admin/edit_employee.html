{% extends "admin/base_admin.html" %}

{% block title %}Edit Employee{% endblock %}

{% block content %}

<h1>Edit Employee</h1>

<form method="POST">

    <label>Department</label>

    <input
        type="text"
        name="department"
        value="{{ employee.department }}"
        required
    >

    <br><br>

    <label>Designation</label>

    <input
        type="text"
        name="designation"
        value="{{ employee.designation }}"
        required
    >

    <br><br>

    <label>Salary</label>

    <input
        type="number"
        name="salary"
        value="{{ employee.salary }}"
        required
    >

    <br><br>

    <button type="submit">
        Update Employee
    </button>

</form>

{% endblock %}
