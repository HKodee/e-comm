{% extends "base.html" %}

{% block title %}
Users
{% endblock %}

{% block content %}

<h1>All Users</h1>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
    </tr>

    {% for user in users %}

    <tr>

        <td>{{ user.id }}</td>

        <td>{{ user.username }}</td>

        <td>{{ user.email }}</td>

        <td>{{ user.role }}</td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
